{% extends "page.html" %}

{% block content %}
  {{ intro|safe }}
  
  <h2>Source files</h2>
  
  <ul class="IndexList">
  {% for file in files %}
    <li><a href="zil-{{ file.basename }}.html">{{ file.filename }}</a>
    &nbsp;
    <i>({{ file.lines|length }} lines)</i></li>
  {% endfor %}
  </ul>
{% endblock %}
