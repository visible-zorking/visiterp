{% extends "page.html" %}

{% from 'link.html' import aloc %}

{% block content %}
  <h2>Routines</h2>
  
  <ul class="IndexList">
  {% for rtn in routines %}
    <li><code class="Symbol">{{ aloc(rtn.loc, '', rtn.name) }}</code>
    ({{ rtn.hexaddr }}) {{ rtn.loc.str }}</li>
  {% endfor %}
  </ul>
{% endblock %}
