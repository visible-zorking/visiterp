{% extends "page.html" %}

{% from 'link.html' import aloc %}

{% block content %}
  <h2>Objects</h2>
  
  <ul class="IndexList">
  {% for obj in objects %}
    <li><code class="Symbol">{{ aloc(obj.loc, '', obj.name) }}</code>
    ({{ obj.num }}) {{ obj.loc.str }}</li>
  {% endfor %}
  </ul>
{% endblock %}
