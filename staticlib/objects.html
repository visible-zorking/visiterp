{% extends "page.html" %}

{% from 'link.html' import aloc %}

{% block content %}
  <h2>Objects</h2>
  
  <table class="IndexTable">
  {% for obj in objects %}
    <tr>
    <td class="TableAddr">#{{ obj.num }}</td>
    <td><code class="Symbol">{{ aloc(obj.loc, '', obj.name) }}</code></td>
    <td>{% if commentary['OBJ:'+obj.name] %}**{% endif %}</td>
    <td class="TableLoc">{{ obj.loc.str }}</td>
    </tr>
  {% endfor %}
  </table>
{% endblock %}
