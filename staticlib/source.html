{% extends "page.html" %}

{% block content %}
  <div class="Col">
  {% for ln in lines %}
<div id="line_{{ ln.num }}" class="Line">{% for el in ln.els %}{% if el.style %}<span class="Src_{{ el.style }}">{{ el.text }}</span>{% else %}{{ el.text }}{% endif %}{% endfor %}</div>
  {% endfor %}
  </div>
{% endblock %}
